name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect dependency graph support
        uses: actions/github-script@v9
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const status = repo.security_and_analysis?.dependency_graph?.status ?? "unknown";
            if (status !== "enabled") {
              core.setFailed(
                `Dependency graph must be enabled for dependency review; current status is "${status}".`
              );
            }

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
