name: Dependency Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect dependency graph support
        id: dependency-graph
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get(context.repo);
            const status = repo.security_and_analysis?.dependency_graph?.status ?? "unknown";
            const enabled = status === "enabled";
            core.setOutput("enabled", enabled ? "true" : "false");
            if (!enabled) {
              core.notice(`Skipping dependency review because dependency graph status is "${status}".`);
            }

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
