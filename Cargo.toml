[package]
name = "narrowd"
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/cre4ture/narrowd"
readme = "README.md"
description = "A single-user Rust SSH daemon with a hardened public-exposure profile"
keywords = ["ssh", "daemon", "sftp", "tunnel", "remote-access"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.11"
futures = "0.3.33"
getrandom = "0.4.3"
log = "0.4.33"
portable-pty = "0.9.0"
russh = { version = "0.62.4", default-features = false, features = ["ring"] }
russh-sftp = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "uio", "user"] }
rustix = { version = "1.1.4", features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
rustix = { version = "1.1.4", features = ["thread"] }
seccompiler = "0.5.0"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
tempfile = "3.23.0"
