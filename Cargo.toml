[package]
name = "narrowd"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cre4ture/narrowd"
readme = "README.md"
description = "A single-user Rust SSH daemon with a hardened public-exposure profile"
keywords = ["ssh", "daemon", "sftp", "tunnel", "remote-access"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.8"
futures = "0.3.31"
getrandom = "0.4.2"
log = "0.4.28"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "socket", "uio", "user"] }
portable-pty = "0.9.0"
russh = "0.61.1"
russh-sftp = "2.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ssh-key = "0.7.0-rc.10"
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
tempfile = "3.23.0"
